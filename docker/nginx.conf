server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;


    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Archivos con hash en el nombre: caché permanente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /models/catalog.json {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ ^/(models|hdri|draco)/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Modelos personalizados montados desde el host (volumen de solo lectura).
    location /custom/ {
        alias /srv/configurador/custom/;
        autoindex off;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
