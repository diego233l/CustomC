# Configurador 3D de coches — despliegue con Docker Compose (Unraid u otro host).
# Variables configurables en el archivo .env junto a este archivo.
services:
  configurador-tesla:
    image: ${CONFIGURADOR_IMAGE:-ghcr.io/diego233l/customc:latest}
    container_name: configurador-tesla
    restart: unless-stopped
    # Usuario nobody:users de Unraid (debe poder escribir en la carpeta de datos).
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "${CONFIGURADOR_PORT:-8100}:8080"
    volumes:
      # Coches subidos desde la interfaz (mods de GTA V convertidos). Se conservan al actualizar.
      - ${CONFIGURADOR_DATOS:-./datos}:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ:-Europe/Madrid}
      # Pon SUBIDAS=false para desactivar la subida de coches.
      - SUBIDAS=${SUBIDAS:-true}
      # Opcional: clave que se pedirá en la interfaz para subir o borrar coches.
      - CLAVE_SUBIDAS=${CLAVE_SUBIDAS:-}
      - MAX_SUBIDA_MB=${MAX_SUBIDA_MB:-400}
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8080]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/diego233l/CustomC/HEAD/unraid/icono.png"
